<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Support Chatbot</title>
</head>
<body>
    <h1>Welcome to Customer Support</h1>
    
    <!-- Login Button -->
    <p><a href="/admin/login/">Admin Login</a></p>

    <!-- Chatbot Form -->
    <form method="post">
        {% csrf_token %}
        <input type="text" name="message" placeholder="Ask your question..." required>
        <button type="submit">Send</button>
    </form>

    {% if response %}
        <p><strong>Bot:</strong> {{ response }}</p>
    {% endif %}
</body>
</html>
